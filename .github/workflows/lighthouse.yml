name: Lighthouse (accessibility + performance)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Apply migrations (needed for the session table)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: python manage.py migrate --noinput

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Thresholds in .lighthouserc.json are set to "warn", not "error" --
      # this reports real accessibility/performance data on every push
      # without making the build flaky on a subjective score dip.
      - name: Run Lighthouse CI
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
        run: npx @lhci/cli@0.13.x autorun
